server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  # Hashed assets: cache forever
  location ~* \.(js|css|woff2?|png|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # API goes to the rasid-api container (same origin = no CORS, SameSite=strict cookies work)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
  }

  # Bulk import: up to 500 invoices per request (the API allows 20 MB on this route only).
  location ~ ^/api/businesses/[^/]+/invoices/bulk$ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 20m;
  }

  # Batch progress (Server-Sent Events): stream as written, keep the connection open between events.
  location ~ ^/api/businesses/[^/]+/invoices/batches/[^/]+/events$ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # SPA fallback; never cache index.html so new releases load immediately
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
